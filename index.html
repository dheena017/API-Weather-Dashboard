<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFetch Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons if needed, but we use OpenWeather icons -->
</head>
<body>
    <div class="container">
        <header>
            <h1>SkyFetch Weather Dashboard</h1>
        </header>
        
        <main>
            <div id="weather-container" class="weather-card">
                <h2 id="city-name">Loading City...</h2>
                <div class="weather-info">
                    <img id="weather-icon" src="" alt="Weather Icon" class="hidden">
                    <p id="temperature">--°C</p>
                    <p id="description">Loading weather...</p>
                </div>
            </div>
            <div id="error-message" class="error hidden"></div>
        </main>

        <footer>
            <p>Powered by OpenWeatherMap</p>
        </footer>
    </div>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
