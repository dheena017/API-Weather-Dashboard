<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFetch Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons if needed, but we use OpenWeather icons -->
</head>
<body>
    <div class="container">
        <header>
            <h1>SkyFetch Weather Dashboard</h1>
        </header>
        
        <main>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name">
                <button id="search-btn">Search</button>
            </div>
            
            <div id="recent-searches" class="recent-searches hidden">
                <!-- Recent search buttons will be injected here -->
            </div>

            <div id="loading-message" class="loading hidden">Fetching weather data...</div>
            
            <div id="weather-container" class="weather-card hidden">
                <h2 id="city-name">--</h2>
                <div class="weather-info">
                    <img id="weather-icon" src="" alt="Weather Icon" class="hidden">
                    <p id="temperature">--°C</p>
                    <p id="description">--</p>
                </div>
            </div>

            <div id="forecast-section" class="hidden">
                <h2>5-Day Forecast</h2>
                <div id="forecast-container" class="forecast-grid">
                    <!-- Forecast cards will be injected here -->
                </div>
            </div>

            <div id="error-message" class="error hidden"></div>
        </main>

        <footer>
            <p>Powered by OpenWeatherMap</p>
        </footer>
    </div>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
